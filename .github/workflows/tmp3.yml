name: tmp3
on:
  push:
    branches: [claude/project-thread-3e5w5u]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          H="temperature_2m,apparent_temperature,precipitation,precipitation_probability,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code,cloud_cover"
          mkdir -p tmp3
          for p in "rennes 48.12 -1.68" "cg 47.83 -0.70" "pouance 47.74 -1.17" "guerche 47.94 -1.23"; do
            set -- $p
            for m in best_match meteofrance_arome_france_hd ecmwf_ifs025 gfs_seamless icon_seamless; do
              curl -sS --retry 3 -m 30 -A "BreizhWatts/1.0" "https://api.open-meteo.com/v1/forecast?latitude=$2&longitude=$3&hourly=$H&daily=sunrise,sunset&start_date=2026-11-21&end_date=2026-11-21&timezone=Europe%2FParis&models=$m" -o tmp3/$1_$m.json || echo "fail $1 $m"
            done
          done
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -f tmp3 && git commit -m "tmp3: météo" && git push
