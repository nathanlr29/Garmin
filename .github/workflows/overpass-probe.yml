name: Sonde Overpass (temporaire)
on:
  push:
    branches: [claude/project-thread-u2hlah]
concurrency: { group: overpass-probe, cancel-in-progress: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/overpass-probe.mjs
