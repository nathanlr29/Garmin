name: tmp200
on:
  push:
    branches: [claude/project-thread-3e5w5u]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          H="temperature_2m,apparent_temperature,precipitation,precipitation_probability,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code,cloud_cover"
          mkdir -p tmp200/wx
          for p in "rennes 48.12 -1.68" "n 48.61 -1.68" "e 48.12 -1.01" "s 47.62 -1.68" "w 48.12 -2.35" "ne 48.47 -1.20" "se 47.77 -1.20" "sw 47.77 -2.16" "nw 48.47 -2.16"; do
            set -- $p
            for m in best_match ecmwf_ifs025 gfs_seamless icon_seamless; do
              curl -sS --retry 3 -m 30 -A "BreizhWatts/1.0" "https://api.open-meteo.com/v1/forecast?latitude=$2&longitude=$3&hourly=$H&daily=sunrise,sunset&start_date=2026-11-21&end_date=2026-11-21&timezone=Europe%2FParis&models=$m" -o tmp200/wx/$1_$m.json || echo "fail $1 $m"
              [ "$1" = rennes ] || break
            done
          done
          ls -la tmp200/wx
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -f tmp200/wx && git commit -m "tmp200: météo" && git push
