<body>
<header class="appbar">
  <div class="appbar-in">
    <a class="brand" href="#synthese" aria-label="Breizh Watts : accueil"><img src="icon-180.png" alt="" width="28" height="28"><span>Breizh Watts</span></a>
  </div>
</header>
<div class="wrap">
  <div class="pagehead">
    <div class="pagetitle"><h1 id="title">Breizh Watts</h1><div class="updated" id="updated">Chargement…</div></div>
    <div class="controls">
      <div class="chips" id="years" role="group" aria-label="Année"></div>
      <div class="chips" id="sports" role="group" aria-label="Type d'activité"></div>
    </div>
  </div>
  <main id="app"></main>
  <footer>Données Garmin Connect</footer>
</div>
<div id="recProbe" hidden></div>
<div class="tip" id="tip"></div>
<div class="pop" id="pop" role="dialog"></div>

<script>
"use strict";
// ------------------------------------------------------------------ Config & state
const RIDE_TYPES = new Set(["Ride","VirtualRide","GravelRide","MountainBikeRide","EBikeRide","EMountainBikeRide","Velomobile","Handcycle"]);
// Course = Charge.RUN_TYPES (charge.js est chargé après ce script : lu au moment du filtre, jamais au chargement)
const isRunAct = a => !!(window.Charge && Charge.RUN_TYPES.has(a.t));
const isRunIndoor = a => a.t==="treadmill_running" || a.t==="virtual_run";   // tapis : mention « Tapis », pas de tracé (isIndoor reste celui du vélo)
const SPORTS = [
  {id:"bike", label:"Vélo", f:a=>RIDE_TYPES.has(a.t)},
  {id:"out", label:"Extérieur", f:a=>RIDE_TYPES.has(a.t) && !isIndoor(a)},
  {id:"in", label:"Home trainer", f:a=>RIDE_TYPES.has(a.t) && isIndoor(a)},
  {id:"run", label:"Course", f:isRunAct},
  {id:"all", label:"Tout", f:()=>true},
];
const MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MONTHS_FULL = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const DAYS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const DAYS_FULL = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
const nf = (n,d=0)=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d}).format(n);
const S = {all:[], traces:{}, meta:{}, cfg:{}, year:null, sport:"bike", factSeed:0};
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function isIndoor(a){return a.t==="VirtualRide" || a.tr===1}
function parseLocal(s){const [d,t="00:00:00"]=s.split("T");const [y,m,dd]=d.split("-").map(Number);const [h,mi,se]=t.split(":").map(Number);return new Date(y,m-1,dd,h||0,mi||0,se||0)}
function dayOfYear(dt){return Math.floor((Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())-Date.UTC(dt.getFullYear(),0,1))/864e5)}
function daysInYear(y){return (y%4===0&&y%100!==0)||y%400===0?366:365}
function wd(dt){return (dt.getDay()+6)%7} // 0 = lundi
function hfmt(sec){const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);return h?`${h} h ${String(m).padStart(2,"0")}`:`${m} min`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(dt,withYear){return dt.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short",...(withYear?{year:"numeric"}:{})})}
// Course à pied (filtre « Course ») : allure en min:s/km à la place de la vitesse
const runMode=()=>S.sport==="run";
function paceTxt(sec){if(!isFinite(sec)||sec<=0)return "–";let m=Math.floor(sec/60),s=Math.round(sec%60);if(s===60){m++;s=0}return m+":"+String(s).padStart(2,"0")}
function timeTxt(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`}
const actPace=a=>a.km>0&&a.mt>0?a.mt/a.km:null;   // s/km en mouvement
const goalKm=()=>+(runMode()?S.cfg.objectif_km_course:S.cfg.objectif_km)||0;   // objectif_km_course vide ou 0 : pas de barre

// ------------------------------------------------------------------ Data loading
async function getJSON(url,fallback){
  try{const r=await fetch(url+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return await r.json()}catch(e){return fallback}
}
async function load(){
  const [acts,traces,meta,cfg]=await Promise.all([
    getJSON("data/activities.json",[]),getJSON("data/traces.json",{}),getJSON("data/meta.json",{}),getJSON("config.json",{})]);
  const sig=(meta.updated_at||"")+acts.length;
  if(sig===S.sig) return;               // rien de neuf
  S.sig=sig;
  S.all=acts.map(a=>({...a,dt:parseLocal(a.d),km:a.m/1000}));
  S.traces=traces; S.meta=meta; S.cfg=cfg;
  const years=[...new Set(S.all.map(a=>a.dt.getFullYear()))].sort((a,b)=>b-a);
  const now=new Date().getFullYear();
  if(!years.includes(now)) years.unshift(now);
  S.years=years;
  if(S.year==null){S.year=+(store.get("year"))||now; if(!years.includes(S.year)) S.year=now}
  S.sport=store.get("sport")||S.sport;
  render();
  document.dispatchEvent(new Event("velo:loaded"));
}

// ------------------------------------------------------------------ Helpers on sets
function filt(year){const sp=SPORTS.find(s=>s.id===S.sport)||SPORTS[0];return S.all.filter(a=>sp.f(a)&&(year==null||a.dt.getFullYear()===year))}
function sum(arr,f){let s=0;for(const a of arr)s+=f(a);return s}
function maxBy(arr,f){let b=null,bv=-Infinity;for(const a of arr){const v=f(a);if(v>bv){bv=v;b=a}}return b}
function cumByDay(acts,year){
  const n=daysInYear(year),d=new Array(n).fill(0);
  for(const a of acts) d[dayOfYear(a.dt)]+=a.km;
  const c=[];let s=0;for(let i=0;i<n;i++){s+=d[i];c.push(s)}
  return {daily:d,cum:c};
}
function weekKey(dt){const t=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()-wd(dt));return t.getTime()}

// ------------------------------------------------------------------ Render
function render(){
  document.title=S.cfg.titre||"Breizh Watts";   // le titre de la page (h1) est posé par Nav
  renderUpdated(); renderChips();
  const app=document.getElementById("app");
  if(!S.all.length){
    app.innerHTML=`<div class="card empty"><b>Pas encore de données</b>Lance le workflow « Mise à jour Garmin » dans l'onglet Actions de ton dépôt GitHub, puis reviens ici dans une minute.</div>`;
    return;
  }
  const Y=S.year, now=new Date(), isCur=Y===now.getFullYear();
  const acts=filt(Y), prev=filt(Y-1);
  const todayIdx=isCur?dayOfYear(now):daysInYear(Y)-1;
  const cur=cumByDay(acts,Y), pv=cumByDay(prev,Y-1);
  const km=cur.cum[cur.cum.length-1];
  const prevSameDate=pv.cum[Math.min(todayIdx,pv.cum.length-1)]||0;

  app.innerHTML=`
  <div class="grid">
    <section class="card hud hero span12" id="hero"></section>
    <section class="span12"><div class="tiles" id="tiles"></div></section>
    <section class="card span12" id="chain"${runMode()?" hidden":""}></section>
    <section class="card span8"><h2>Kilomètres cumulés</h2><div id="cum"></div></section>
    <section class="card span4"><h2>Records ${Y}</h2><div class="records" id="records"></div></section>${runMode()?`
    <section class="card span12 progc" id="progCourse"><h2>Progression course <small>chronos, efficacité, allure seuil, reprise</small></h2><div id="progCourseBody"></div></section>`:""}
    <section class="card span12"><h2>Le saviez-tu ? <button class="btn" id="shuffle">Autres anecdotes</button></h2><div class="facts" id="facts"></div></section>
    <section class="card span6"><h2>Par mois <span class="legend"><span><i style="background:var(--accent)"></i>${Y}</span><span><i style="background:var(--ghost)"></i>${Y-1}</span></span></h2><div id="months"></div></section>
    <section class="card span6"><h2>Habitudes</h2><div id="habits"></div></section>
    <section class="card span12"><h2>Calendrier ${Y} <small id="heatInfo"></small></h2><div class="heatwrap" id="heatwrap"><div id="heat"></div></div>
      <div class="heatlegend">moins <span style="background:var(--h0)"></span><span style="background:var(--h1)"></span><span style="background:var(--h2)"></span><span style="background:var(--h3)"></span><span style="background:var(--h4)"></span><span style="background:var(--h5)"></span> plus</div></section>
    <section class="card span12"><h2>Dernières sorties</h2><div class="rides" id="rides"></div></section>
    <section class="card span12"><h2>Toutes les années</h2><div id="years-table"></div></section>
  </div>`;

  renderHero(acts,km,prevSameDate,isCur,todayIdx,Y,prev);
  renderTiles(acts,Y);
  renderCum(cur.cum,pv.cum,todayIdx,isCur,Y);
  renderRecords(acts);
  renderFacts(acts,Y,isCur,todayIdx);
  renderMonths(acts,prev,Y);
  renderHabits(acts);
  renderHeat(cur.daily,Y,isCur,todayIdx,acts);
  renderRides();
  renderYears();
  if(!runMode()) window.Chain?.render();   // graissage de chaîne : propre au vélo
  else window.Course?.render(document.getElementById("progCourseBody"));
  document.getElementById("shuffle").onclick=()=>{S.factSeed++;renderFacts(acts,Y,isCur,todayIdx)};
}

function renderUpdated(){
  const el=document.getElementById("updated");
  const u=S.meta.updated_at?new Date(S.meta.updated_at):null;
  let txt="Jamais synchronisé";
  if(u){const m=Math.round((Date.now()-u)/6e4);
    txt=m<1?"Mis à jour à l'instant":m<60?`Mis à jour il y a ${m} min`:m<1440?`Mis à jour il y a ${Math.round(m/60)} h`:`Mis à jour le ${u.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}`}
  let repo=S.cfg.depot;
  if(!repo&&location.hostname.endsWith("github.io")){const user=location.hostname.split(".")[0];const name=location.pathname.split("/").filter(Boolean)[0]||`${user}.github.io`;repo=`${user}/${name}`}
  el.innerHTML=`<span>${esc(txt)}</span>`+(repo?`<a href="https://github.com/${esc(repo)}/actions/workflows/update.yml" target="_blank" rel="noopener">Forcer la mise à jour</a>`:"");
}

function renderChips(){
  const y=document.getElementById("years"), s=document.getElementById("sports");
  y.innerHTML=S.years.map(v=>`<button class="chip" aria-pressed="${v===S.year}" data-y="${v}">${v}</button>`).join("");
  const present=new Set(S.all.map(a=>a.t));
  const hasOther=[...present].some(t=>!RIDE_TYPES.has(t));
  const hasIn=S.all.some(a=>RIDE_TYPES.has(a.t)&&isIndoor(a)), hasRun=S.all.some(isRunAct);
  s.innerHTML=SPORTS.filter(x=>(x.id!=="all"||hasOther)&&((x.id!=="in"&&x.id!=="out")||hasIn)&&(x.id!=="run"||hasRun))
    .map(v=>`<button class="chip" aria-pressed="${v.id===S.sport}" data-s="${v.id}">${v.label}</button>`).join("");
  if(!s.querySelector('[aria-pressed="true"]')){S.sport="bike";s.firstElementChild?.setAttribute("aria-pressed","true")}
  y.onclick=e=>{const b=e.target.closest("[data-y]");if(!b)return;S.year=+b.dataset.y;store.set("year",S.year);render()};
  s.onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;S.sport=b.dataset.s;store.set("sport",S.sport);render()};
  y.querySelector('[aria-pressed="true"]')?.scrollIntoView({block:"nearest",inline:"nearest"});
}

function countUp(el,to,dur=1100){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce||to<1){el.textContent=nf(to);return}
  const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=nf(to*e);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

function renderHero(acts,km,prevSame,isCur,todayIdx,Y,prev){
  const goal=goalKm();
  const n=daysInYear(Y), elapsed=todayIdx+1;
  const proj=isCur?km/elapsed*n:km;
  const diff=km-prevSame;
  const prevTotal=sum(prev,a=>a.km);
  let goalHtml="";
  if(goal>0 && S.sport!=="all"){
    const pct=Math.min(100,km/goal*100), expected=isCur?goal*elapsed/n:goal;
    const ahead=km-expected;
    const left=Math.max(0,goal-km), weeksLeft=Math.max(1,(n-elapsed)/7);
    let note;
    if(km>=goal) note=`<b>Objectif atteint</b> : ${nf(km-goal)} km de bonus.`;
    else if(isCur) note=`${ahead>=0?`<b>${nf(ahead)} km d'avance</b> sur le rythme.`:`<b>${nf(-ahead)} km de retard</b> sur le rythme.`} Encore <b>${nf(left/weeksLeft)} km par semaine</b> pour y arriver.`;
    else note=`Objectif manqué de <b>${nf(left)} km</b>.`;
    goalHtml=`<div class="goal">
      <div class="goalrow"><span>Objectif ${Y} : <b>${nf(goal)} km</b></span><span><b>${nf(pct)} %</b></span></div>
      <div class="goalbar"><div class="fill" style="width:0"></div>${isCur?`<div class="tick" style="left:${(elapsed/n*100).toFixed(2)}%" title="Rythme attendu aujourd'hui"></div>`:""}</div>
      <div class="goalnote">${note}</div>
      ${isCur?`<div class="goalrow"><span>Projection au 31 déc.</span><b>${nf(proj)} km</b></div>`:""}
    </div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=document.querySelector(".goalbar .fill");if(f)f.style.width=pct+"%"}));
  } else if(isCur){
    goalHtml=`<div class="goal"><div class="goalrow"><span>Projection au 31 décembre</span><b>${nf(proj)} km</b></div>
      <div class="goalrow"><span>${Y-1} au total</span><b>${nf(prevTotal)} km</b></div></div>`;
  }
  const label=S.sport==="in"?"sur home trainer":S.sport==="out"?"en extérieur":S.sport==="all"?"toutes activités":S.sport==="run"?"en course à pied":"à vélo";
  document.getElementById("hero").innerHTML=`
    <div>
      <div class="kick">${label[0].toUpperCase()+label.slice(1)} en ${Y}${isCur?`, au ${new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long"})}`:""}</div>
      <div class="big"><span id="bigkm">0</span><span class="unit">km</span></div>
      ${prev.length?`<div class="delta${diff<0?" down":""}"><b>${diff>=0?"↑ +":"↓ −"}${nf(Math.abs(diff))} km</b> par rapport à ${Y-1}${isCur?" à la même date":""}</div>`:""}
    </div>${goalHtml}`;
  countUp(document.getElementById("bigkm"),km);
  const last=[...acts].reverse().find(a=>!(runMode()?isRunIndoor(a):isIndoor(a))&&(S.traces[a.id]||[]).length>=10);   // filigrane : ta dernière sortie dehors
  if(last) document.getElementById("hero").insertAdjacentHTML("afterbegin",`<div class="herotrace" aria-hidden="true">${traceSvg(S.traces[last.id])}</div>`);
}

function renderTilesRun(acts){
  const n=acts.length, mt=sum(acts,a=>a.mt), el=sum(acts,a=>a.el), km=sum(acts,a=>a.km);
  const outdoor=acts.filter(a=>!isRunIndoor(a)&&actPace(a));
  const pace=outdoor.length?sum(outdoor,a=>a.mt)/Math.max(1,sum(outdoor,a=>a.km)):null;
  const longest=maxBy(acts,a=>a.km), ge10=acts.filter(a=>a.km>=10).length, ge21=acts.filter(a=>a.km>=21.1).length;
  const hrActs=acts.filter(a=>a.hr>0), hrAvg=sum(hrActs,a=>a.hr*a.mt)/Math.max(1,sum(hrActs,a=>a.mt));
  const tss=window.Charge?sum(acts,a=>Charge.tssOf(a)):0;
  const tiles=[
    ["Sorties",nf(n),"",`${nf(km/Math.max(1,n),1)} km en moyenne`],
    ["Temps de course",nf(Math.floor(mt/3600)),"h",`${nf(mt/3600/Math.max(1,n),1)} h par sortie`],
    ["Dénivelé",nf(el),"m",`${nf(el/Math.max(1,km)*10,1)} m/10 km`],
    ["Allure moyenne",pace?paceTxt(pace):"–","/km","sorties dehors"],
    ["Plus longue sortie",longest?nf(longest.km,1):"–","km",longest?fmtDate(longest.dt):""],
    ["Sorties ≥ 10 km",nf(ge10),"",`${nf(ge21)} de plus de 21 km`],
    ["FC moyenne",hrActs.length?nf(hrAvg):"–","bpm","sorties avec capteur"],
    ["Charge (rTSS)",nf(tss),"",`${nf(tss/Math.max(1,n))} par sortie`],
  ];
  document.getElementById("tiles").innerHTML=tiles.map(t=>`<div class="tile"><div class="l">${t[0]}</div><div class="v">${t[1]}<small>${t[2]}</small></div><div class="s">${esc(t[3])||"&nbsp;"}</div></div>`).join("");
}
function renderTiles(acts,Y){
  if(runMode()) return renderTilesRun(acts);
  const n=acts.length, mt=sum(acts,a=>a.mt), el=sum(acts,a=>a.el), km=sum(acts,a=>a.km);
  const outdoor=acts.filter(a=>!isIndoor(a));
  const v=sum(outdoor,a=>a.km)/Math.max(1,sum(outdoor,a=>a.mt))*3600;
  const longest=maxBy(acts,a=>a.km);
  const big=acts.filter(a=>a.km>=200).length, cent=acts.filter(a=>a.km>=100).length;
  const cal=sum(acts,a=>a.cal||0), kcal=cal>0?cal:km*28;
  const hrActs=acts.filter(a=>a.hr>0), hrAvg=sum(hrActs,a=>a.hr*a.mt)/Math.max(1,sum(hrActs,a=>a.mt));
  const tl=sum(acts,a=>a.tl||0);
  const tiles=[
    ["Sorties",nf(n),"",`${nf(km/Math.max(1,n),1)} km en moyenne`],
    ["Temps en selle",nf(Math.floor(mt/3600)),"h",`${nf(mt/3600/Math.max(1,n),1)} h par sortie`],
    ["Dénivelé",nf(el),"m",`${nf(el/Math.max(1,km)*10,1)} m/10 km`],
    ["Vitesse moyenne",outdoor.length?nf(v,1):"–","km/h","sorties extérieures"],
    ["Plus longue sortie",longest?nf(longest.km,0):"–","km",longest?fmtDate(longest.dt):""],
    [big?"Sorties ≥ 200 km":"Sorties ≥ 100 km",nf(big||cent),"",big?`${nf(cent)} de plus de 100 km`:""],
    ["Calories",nf(kcal),"kcal",cal>0?"mesurées par Garmin":"estimation"],
    tl>0?["Charge d'entraînement",nf(tl),"",`${nf(tl/Math.max(1,n))} par sortie`]:["FC moyenne",hrActs.length?nf(hrAvg):"–","bpm","sorties avec capteur"],
  ];
  document.getElementById("tiles").innerHTML=tiles.map(t=>`<div class="tile"><div class="l">${t[0]}</div><div class="v">${t[1]}<small>${t[2]}</small></div><div class="s">${esc(t[3])||"&nbsp;"}</div></div>`).join("");
}

// ---- Tooltip
const tip=document.getElementById("tip");
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;const x=Math.min(innerWidth-tip.offsetWidth-8,Math.max(8,e.clientX-tip.offsetWidth/2));tip.style.left=x+"px";tip.style.top=(e.clientY-tip.offsetHeight-12)+"px"}
function hideTip(){tip.style.opacity=0}
function actUrl(a){return `https://connect.garmin.com/modern/activity/${a.id}`}
const pop=document.getElementById("pop");
function showPop(e,html){pop.innerHTML=html;pop.style.display="block";const x=Math.min(innerWidth-pop.offsetWidth-8,Math.max(8,e.clientX-pop.offsetWidth/2));let y=e.clientY+12;if(y+pop.offsetHeight>innerHeight-8)y=e.clientY-pop.offsetHeight-12;pop.style.left=x+"px";pop.style.top=Math.max(8,y)+"px"}
function hidePop(){pop.style.display="none"}
document.addEventListener("click",e=>{if(!pop.contains(e.target))hidePop()});
document.addEventListener("scroll",hidePop,{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hidePop()});
document.addEventListener("scroll",hideTip,{passive:true});

function renderCum(cur,prev,todayIdx,isCur,Y){
  const box=document.getElementById("cum");
  const W=Math.max(300,box.clientWidth), H=Math.round(Math.min(400,Math.max(210,W*.56)));
  const m={l:44,r:12,t:14,b:24}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const goal=goalKm();
  const showGoal=goal>0&&S.sport!=="all";
  const curEnd=isCur?todayIdx:cur.length-1;
  const maxY=Math.max(cur[curEnd]||0,prev[prev.length-1]||0,showGoal?goal:0,10)*1.06;
  const x=i=>m.l+i/365*iw, y=v=>m.t+ih-v/maxY*ih;

function streaks(acts){
  const days=new Set(acts.map(a=>dayOfYear(a.dt)+a.dt.getFullYear()*1000));
  const sorted=[...new Set(acts.map(a=>new Date(a.dt.getFullYear(),a.dt.getMonth(),a.dt.getDate()).getTime()))].sort((a,b)=>a-b);
  let bestD=0,c=0,prev=null;for(const t of sorted){c=prev!=null&&Math.round((t-prev)/864e5)===1?c+1:1;bestD=Math.max(bestD,c);prev=t}
  const wks=[...new Set(acts.map(a=>weekKey(a.dt)))].sort((a,b)=>a-b);
  let bestW=0;c=0;prev=null;for(const t of wks){c=prev!=null&&Math.round((t-prev)/(7*864e5))===1?c+1:1;bestW=Math.max(bestW,c);prev=t}
  return {bestD,bestW,days:days.size};
}

  const wkend=acts.filter(a=>wd(a.dt)>=5),wk=sum(wkend,a=>a.km);add(`${nf(wk/km*100)} %`,"de tes km faits le week-end",`${nf(km-wk)} km en semaine`,1);
  const vm=maxBy(acts.filter(a=>!isIndoor(a)),a=>a.vmax);if(vm&&vm.vmax>40) add(nf(vm.vmax),"km/h : ta pointe de vitesse",`${vm.n} · ${fmtDate(vm.dt)}`,2);

}
function factsRun(acts,Y,isCur,todayIdx){
  const km=sum(acts,a=>a.km),el=sum(acts,a=>a.el),mt=sum(acts,a=>a.mt);
  if(!acts.length) return [];
  const F=[];const city=S.cfg.ville||"Rennes";
  const add=(n,t,sub,w=1)=>F.push({n,t,sub,w});
  if(el>0){const ev=el/8849;add(ev>=1?`×${nf(ev,1)}`:`${nf(ev*100)} %`,ev>=1?"l'Everest gravi depuis le niveau de la mer":"de l'Everest gravi",`${nf(el)} m de dénivelé positif`,3)}
  const c=[...CITIES].filter(x=>x[1]<=km).sort((a,b)=>b[1]-a[1])[0];
  if(c) add(nf(km/c[1],1)+"×",`la route ${city} → ${c[0]}, à pied`,`≈ ${nf(c[1])} km par la route`,3);
  add(`${nf(km/40075*100,1)} %`,"du tour de la Terre à pied",`il en reste ${nf(Math.max(0,40075-km))} km`,2);
  if(km>=10) add(nf(km/42.195,1),"marathons mis bout à bout",`${nf(km)} km au total`,3);
  add(nf(km*1000/400),"tours de piste de 400 m",`${nf(km)} km au total`,1);
  add(`${nf(mt/3600)} h`,"passées à courir",`soit ${nf(mt/86400,1)} jour${mt/86400>=2?"s":""} non-stop`,2);
  const cal=sum(acts,a=>a.cal||0);if(cal>0) add(nf(cal/240),"croissants brûlés","à 240 kcal le croissant",3);
  const d=new Array(7).fill(0);acts.forEach(a=>d[wd(a.dt)]+=a.km);const fav=d.indexOf(Math.max(...d));
  if(km>0) add(DAYS[fav],`ton jour préféré pour courir : le ${DAYS_FULL[fav]}`,`${nf(d[fav]/km*100)} % de tes km`,3);
  const early=acts.filter(a=>a.dt.getHours()<8).length;
  if(early) add(nf(early),`sorties lancées avant 8 h`,`${nf(early/acts.length*100)} % de tes sorties`,2);
  const st=streaks(acts);
  if(st.bestW>1) add(nf(st.bestW),"semaines d'affilée avec au moins une course","ta meilleure série",3);
  if(st.bestD>1) add(nf(st.bestD),"jours de suite à courir","ta plus longue série",2);
  const lastA=S.all.filter(isRunAct).slice(-1)[0];
  if(isCur&&lastA){const ago=Math.floor((Date.now()-lastA.dt)/864e5);add(ago===0?"Auj.":`${ago} j`,ago===0?"tu as couru aujourd'hui":"depuis ta dernière course",lastA.n,2)}
  const elapsed=isCur?todayIdx+1:daysInYear(Y);add(`${nf(km/elapsed,1)}`,"km par jour en moyenne","jours de repos compris",2);
  const semi=acts.filter(a=>a.km>=21.1);if(semi.length) add(nf(semi.length),`sortie${semi.length>1?"s":""} de 21,1 km et plus`,`${nf(sum(semi,a=>a.km))} km au total`,3);
  const hrA=acts.filter(a=>a.hr>0),beats=sum(hrA,a=>a.hr*a.mt/60);if(beats>0) add(beats>=1e6?`${nf(beats/1e6,1)} M`:nf(beats),"battements de cœur en courant",`à ${nf(sum(hrA,a=>a.hr*a.mt)/Math.max(1,sum(hrA,a=>a.mt)))} bpm de moyenne`,2);
  const hte=acts.filter(a=>a.te>=4).length;if(hte) add(nf(hte),"courses à effet aérobie « très important » (4+)","selon le Training Effect Garmin",1);
  const wkend=acts.filter(a=>wd(a.dt)>=5),wk=sum(wkend,a=>a.km);if(km>0) add(`${nf(wk/km*100)} %`,"de tes km faits le week-end",`${nf(km-wk)} km en semaine`,1);
  const months=new Array(12).fill(0);acts.forEach(a=>months[a.dt.getMonth()]+=a.km);const bm=months.indexOf(Math.max(...months));
  if(km>0) add(MONTHS[bm].replace(".",""),`ton plus gros mois : ${MONTHS_FULL[bm]}`,`${nf(months[bm])} km`,2);
  return F;
}
function renderFacts(acts,Y,isCur,todayIdx){
  const F=runMode()?factsRun(acts,Y,isCur,todayIdx):facts(acts,Y,isCur,todayIdx);
  // tirage pondéré déterministe, change à chaque clic sur « Autres anecdotes »
  let seed=S.factSeed*9301+Y*49297+S.sport.length*233;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const pool=F.map(f=>({f,k:Math.pow(rnd(),1/f.w)})).sort((a,b)=>b.k-a.k).slice(0,6).map(x=>x.f);
  document.getElementById("facts").innerHTML=pool.length?pool.map(f=>`<div class="fact"><div class="n">${esc(f.n)}</div><div class="t">${esc(f.t)}<small>${esc(f.sub||"")}</small></div></div>`).join(""):`<div class="empty">Pas encore d'anecdote cette année.</div>`;
}

// ------------------------------------------------------------------ Rides
function traceSvg(pts){
  if(!pts||pts.length<2) return `<svg viewBox="0 0 76 76"><path d="M22 52c8-4 10-22 18-24s8 14 16 10" fill="none" stroke="var(--ghost)" stroke-width="2.4" stroke-dasharray="2 5" stroke-linecap="round"/></svg>`;
  const lat0=pts[0][0]*Math.PI/180,kx=Math.cos(lat0);
  const xs=pts.map(p=>p[1]*kx),ys=pts.map(p=>-p[0]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const sc=64/Math.max(maxx-minx,maxy-miny,1e-6),ox=(76-(maxx-minx)*sc)/2,oy=(76-(maxy-miny)*sc)/2;
  const d=pts.map((p,i)=>(i?"L":"M")+((xs[i]-minx)*sc+ox).toFixed(1)+","+((ys[i]-miny)*sc+oy).toFixed(1)).join("");
  return `<svg viewBox="0 0 76 76"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
// Fil des dernières sorties, façon Strava : qui / quand, rangée de chiffres avec libellés, tracé à droite.
// Séance d'intérieur (pas de tracé) : petit écran noir avec la puissance moyenne (allure sur tapis), comme sur MyWhoosh / Zwift.
const SPORT_ICO={
  bike:'<path d="M5.5 16.5 9 9h6l3.5 7.5M9 9l3 7.5H5.5M15 9l-1-3h-2"/><circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/>',
  run:'<circle cx="14.5" cy="4.5" r="1.8"/><path d="M7 21l3.2-5.5 3.3 2.5V22M5.5 11.5 9 8.5h4.5l2 3.5 3 1M10.2 15.5 12 9"/>'};
function rideHtml(a){
  const run=isRunAct(a), indoor=run?isRunIndoor(a):isIndoor(a), pace=actPace(a);
  const st=[["Distance",`${nf(a.km,1)} km`]];
  if(run){ if(pace) st.push(["Allure",`${paceTxt(pace)} /km`]); st.push(["Temps",hfmt(a.mt)]); if(a.el&&!indoor) st.push(["Dénivelé",`${nf(a.el)} m`]); else if(a.hr>0) st.push(["FC",`${nf(a.hr)} bpm`]); }
  else { if(a.el) st.push(["Dénivelé",`${nf(a.el)} m`]); st.push(["Temps",hfmt(a.mt)]);
    if(a.mt&&!indoor) st.push(["Vitesse",`${nf(a.km/a.mt*3600,1)} km/h`]); else if(a.w) st.push(["Puissance",`${a.w} W`]); }
  const thumb=!indoor&&a.km>=3?`<div class="map">${traceSvg(S.traces[a.id])}</div>`   // sous 3 km, la coupure de 400 m aux deux bouts ne laisse presque rien
    :!indoor?`<div class="map sh"><b>${hfmt(a.mt)}</b><small>durée</small></div>`
    :run?`<div class="map in"><b>${pace?paceTxt(pace):hfmt(a.mt)}</b><small>${pace?"min/km":"durée"}</small></div>`
    :`<div class="map in"><b>${a.w?a.w:hfmt(a.mt)}</b><small>${a.w?"W moy.":"durée"}</small></div>`;
  const where=indoor?(run?"Tapis":"Home trainer"):"";
  return `<a class="ride" href="${actUrl(a)}" target="_blank" rel="noopener">
    <div class="who"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SPORT_ICO[run?"run":"bike"]}</svg></span>
      <div style="min-width:0"><div class="nm">${esc(a.n)}</div><div class="dt">${fmtDate(a.dt,true)}${where?`, <span class="indoor">${where}</span>`:""}</div></div></div>
    <div class="st">${st.map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join("")}</div>
    ${thumb}</a>`;
}
function renderRides(){
  const sp=SPORTS.find(s=>s.id===S.sport)||SPORTS[0];
  const L=S.all.filter(sp.f).slice(innerWidth<520?-5:-10).reverse();
  document.getElementById("rides").innerHTML=L.map(rideHtml).join("")||`<div class="empty">Aucune sortie</div>`;
}

function renderYears(){
  const sp=SPORTS.find(s=>s.id===S.sport)||SPORTS[0];
  const by={};S.all.filter(sp.f).forEach(a=>{const y=a.dt.getFullYear();const o=by[y]=by[y]||{km:0,el:0,n:0,mt:0};o.km+=a.km;o.el+=a.el;o.n++;o.mt+=a.mt});
  const ys=Object.keys(by).map(Number).sort((a,b)=>b-a);const mx=Math.max(...ys.map(y=>by[y].km),1);
  document.getElementById("years-table").innerHTML=`<table><thead><tr><th>Année</th><th style="width:34%"></th><th>km</th><th>D+</th><th>Sorties</th><th>Heures</th></tr></thead><tbody>${ys.map(y=>`<tr class="${y===S.year?"cur":""}"><td>${y}</td><td><div class="yearbar" style="width:${by[y].km/mx*100}%;${y===S.year?"":"opacity:.35"}"></div></td><td>${nf(by[y].km)}</td><td>${nf(by[y].el)}</td><td>${nf(by[y].n)}</td><td>${nf(by[y].mt/3600)}</td></tr>`).join("")}</tbody></table>`;
}
